services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agrosathi
      POSTGRES_USER: agrosathi
      POSTGRES_PASSWORD: agrosathi_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://agrosathi:agrosathi_password@postgres:5432/agrosathi
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
