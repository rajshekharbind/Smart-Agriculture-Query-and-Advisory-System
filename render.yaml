services:
  - type: web
    name: agrosathi-backend
    runtime: python
    plan: free
    buildCommand: pip install --no-cache-dir -r requirements-render.txt && python backend/scripts/train_models.py
    startCommand: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.14
      - key: LOW_MEMORY_MODE
        value: "1"
      - key: USE_TF
        value: "0"
      - key: USE_TORCH
        value: "1"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        value: smartagri-kb
      - key: PINECONE_REGION
        value: us-east-1
      - key: HUGGINGFACE_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"
